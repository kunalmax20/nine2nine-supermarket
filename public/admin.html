<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nine2nine | Admin Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f3e3d0;
        color: #334155;
      }
      .admin-card {
        background-color: #ffffff;
        border: 1px solid rgba(129, 166, 198, 0.2);
        border-radius: 1.5rem;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      }
      .logo-pink {
        color: #ff87b9;
      }
      input,
      select,
      textarea {
        outline: none;
        transition: all 0.2s;
        border: 1px solid #e2e8f0;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: #81a6c6;
        box-shadow: 0 0 0 2px rgba(129, 166, 198, 0.2);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>

  <body class="p-4 md:p-8">
    <div
      id="security-check"
      class="fixed inset-0 bg-[#f3e3d0] z-[300] flex flex-col items-center justify-center font-bold text-[#001F5B] p-4 text-center"
    >
      <div class="mb-4 text-xl md:text-2xl animate-pulse">
        Verifying Admin Access...
      </div>
      <button
        onclick="logout()"
        class="px-6 py-2 bg-white rounded-full text-xs text-red-500 shadow-sm hover:bg-red-50"
      >
        Cancel / Exit
      </button>
    </div>

    <div class="max-w-6xl mx-auto">
      <div
        class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8"
      >
        <h1
          class="text-2xl md:text-3xl font-bold tracking-tighter text-center md:text-left"
        >
          <span class="text-[#001F5B]">nine</span
          ><span class="logo-pink">2</span
          ><span class="text-[#001F5B]">nine</span>
          <span
            class="block text-[10px] md:text-xs text-[#81a6c6] uppercase tracking-widest font-bold"
            >Inventory Manager</span
          >
        </h1>
        <div class="flex items-center gap-3">
          <button
            onclick="logout()"
            class="text-xs font-bold text-slate-400 hover:text-red-500 transition uppercase"
          >
            Logout
          </button>
          <a
            href="index.html"
            class="bg-[#001F5B] text-white px-4 md:px-6 py-2 rounded-xl font-bold shadow-md hover:bg-[#001540] transition text-sm"
            >View Shop →</a
          >
        </div>
      </div>

      <div class="admin-card p-5 md:p-8 mb-8">
        <div class="flex justify-between items-center mb-6">
          <h2 class="font-bold text-lg md:text-xl text-[#001F5B]">
            Add New Product
          </h2>
          <button
            onclick="addNewCategoryPrompt()"
            class="text-[10px] md:text-xs font-bold text-[#81a6c6] hover:underline uppercase"
          >
            + New Category
          </button>
        </div>
        <div
          class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4"
        >
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1"
              >Name</label
            >
            <input
              id="pName"
              placeholder="Item name"
              class="p-3 rounded-xl bg-slate-50 text-sm w-full"
            />
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1"
              >Category</label
            >
            <select
              id="pCategory"
              class="p-3 rounded-xl bg-slate-50 text-sm w-full cursor-pointer"
            ></select>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1"
              >Unit</label
            >
            <input
              id="pUnit"
              placeholder="e.g. kg, pcs"
              class="p-3 rounded-xl bg-slate-50 text-sm w-full"
            />
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1"
              >Price (₹)</label
            >
            <input
              id="pPrice"
              type="number"
              placeholder="0"
              class="p-3 rounded-xl bg-slate-50 text-sm w-full"
            />
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1"
              >Stock</label
            >
            <input
              id="pStock"
              type="number"
              placeholder="Qty"
              class="p-3 rounded-xl bg-slate-50 text-sm w-full"
            />
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1"
              >Image</label
            >
            <input
              id="pImage"
              type="file"
              class="border-none p-2 rounded-xl bg-slate-50 text-[10px] w-full"
            />
          </div>
        </div>
        <button
          onclick="addItem()"
          id="addBtn"
          class="w-full bg-[#81a6c6] text-white py-3 md:py-4 rounded-2xl mt-6 font-bold shadow-lg hover:bg-[#5d8caa] transition uppercase tracking-widest text-xs md:text-sm"
        >
          Save Product to Inventory
        </button>
      </div>

      <div class="admin-card overflow-hidden mb-8">
        <div class="overflow-x-auto no-scrollbar">
          <table class="w-full text-left min-w-[700px]">
            <thead
              class="bg-slate-50 border-b border-slate-100 text-[#81a6c6] text-[10px] uppercase tracking-widest font-bold"
            >
              <tr>
                <th class="p-5">Product Details</th>
                <th class="p-5">Price (₹)</th>
                <th class="p-5">Stock Management</th>
                <th class="p-5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="adminList" class="divide-y divide-slate-50"></tbody>
          </table>
        </div>
      </div>

      <div class="admin-card p-5 md:p-8 mb-8">
        <h2 class="font-bold text-lg md:text-xl text-[#001F5B] mb-6">
          Manage Customer Reviews
        </h2>
        <div
          id="admin-reviews-list"
          class="grid grid-cols-1 md:grid-cols-2 gap-6"
        ></div>
      </div>
    </div>

    <script>
      let products = [],
        currentUser = null,
        categories = [];

      window.onload = function () {
        const userStr = localStorage.getItem("kirana_user");
        if (!userStr) {
          window.location.href = "index.html";
          return;
        }
        currentUser = JSON.parse(userStr);
        currentUser.phone = String(currentUser.phone).replace(/\D/g, "");
        if (!currentUser.isAdmin) {
          window.location.href = "index.html";
          return;
        }
        document.getElementById("security-check").classList.add("hidden");
        loadAdmin();
        loadAdminReviews();
      };

      async function loadAdmin() {
        try {
          const res = await fetch("/api/products?t=" + Date.now());
          products = await res.json();
          syncCategoryList();
          renderList();
        } catch (e) {
          console.error("Failed to load inventory");
        }
      }

      function syncCategoryList() {
        const existing = products.map((p) => p.category || "General");
        categories = ["General", ...new Set(existing)];
        document.getElementById("pCategory").innerHTML = categories
          .map((c) => `<option value="${c}">${c}</option>`)
          .join("");
      }

      function addNewCategoryPrompt() {
        const newCat = prompt("Enter new category name:");
        if (newCat && newCat.trim() !== "") {
          const clean = newCat.trim();
          if (!categories.includes(clean)) {
            const sel = document.getElementById("pCategory");
            const opt = document.createElement("option");
            opt.value = clean;
            opt.innerText = clean;
            sel.appendChild(opt);
            sel.value = clean;
          }
        }
      }

      function renderList() {
        const list = document.getElementById("adminList");
        if (!products.length) {
          list.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-slate-400">No products found</td></tr>`;
          return;
        }
        list.innerHTML = products
          .map((p) => {
            let variantHtml = "";
            if (p.options && p.options.length > 0) {
              variantHtml =
                `<div class="mt-2 space-y-1">` +
                p.options
                  .map(
                    (opt, idx) => `
              <div class="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded-md flex justify-between items-center group">
                <span><b>${opt.size}</b>: ₹${opt.price} (Stk: ${opt.stock})</span>
                <div class="flex gap-2">
                  <button onclick="updateVariantStockPrompt('${p._id}', ${idx})" class="text-blue-500 font-bold hover:underline">Restock</button>
                  <button onclick="removeVariant('${p._id}', ${idx})" class="text-red-400 hover:text-red-600 font-bold">×</button>
                </div>
              </div>`,
                  )
                  .join("") +
                `</div>`;
            }
            return `<tr class="hover:bg-slate-50 transition border-b border-slate-50">
            <td class="p-5 flex gap-4 items-center">
                <div class="relative group w-12 h-12 shrink-0">
                  <div class="w-full h-full bg-slate-100 rounded-xl overflow-hidden border border-slate-200">
                    <img id="img-${p._id}" src="${p.emoji}" class="w-full h-full object-contain">
                  </div>
                  <button onclick="document.getElementById('file-input-${p._id}').click()" class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition rounded-xl flex items-center justify-center cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                  </button>
                  <input type="file" id="file-input-${p._id}" class="hidden" accept="image/*" onchange="updateProductImage('${p._id}', this.files[0])">
                </div>
                <div class="min-w-0">
                  <p class="font-bold text-sm text-[#001F5B] truncate">${p.name}</p>
                  <p class="text-[10px] font-bold text-[#81a6c6] uppercase">${p.category} | ${p.unit || "Unit"}</p>
                  ${variantHtml}
                  <button onclick="addVariantPrompt('${p._id}')" class="mt-2 text-[9px] font-bold text-blue-500 uppercase flex items-center gap-1">+ Add Size Variant</button>
                </div>
            </td>
            <td class="p-5 font-bold text-sm text-slate-600">
               <div class="flex items-center gap-1">
                <span class="text-slate-300 text-xs">₹</span>
                <input type="number" value="${p.price}" onchange="updateProduct('${p._id}','price',this.value)" class="bg-transparent font-bold text-sm w-14 border-b border-transparent focus:border-[#81a6c6] outline-none">
              </div>
            </td>
            <td class="p-5">
              <div class="flex items-center gap-3">
                <input type="number" placeholder="+/-" onchange="restockProduct('${p._id}', this.value)" class="border p-2 w-16 rounded-lg text-xs bg-slate-50">
                <div class="leading-tight">
                  <span class="text-[9px] text-slate-400 block uppercase font-bold">Stock</span>
                  <b class="text-sm ${p.stockQuantity <= 5 ? "text-red-500" : "text-slate-700"}">${p.stockQuantity}</b>
                </div>
              </div>
            </td>
            <td class="p-5 text-right"><button onclick="deleteItem('${p._id}')" class="text-red-400 hover:text-red-600 transition p-2"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button></td>
          </tr>`;
          })
          .join("");
      }

      async function addItem() {
        const btn = document.getElementById("addBtn");
        const name = document.getElementById("pName").value;
        const category = document.getElementById("pCategory").value;
        const unit = document.getElementById("pUnit").value || "Unit";
        const price = document.getElementById("pPrice").value;
        const stock = document.getElementById("pStock").value;
        const imageFile = document.getElementById("pImage").files[0];
        if (!name || !imageFile)
          return alert("Product Name and Image are strictly required!");
        btn.innerText = "Processing...";
        btn.disabled = true;
        const fd = new FormData();
        fd.append("phone", currentUser.phone);
        fd.append("name", name);
        fd.append("category", category);
        fd.append("unit", unit);
        fd.append("price", Number(price) || 0);
        fd.append("stockQuantity", Number(stock) || 0);
        fd.append("productImage", imageFile);
        fd.append("options", JSON.stringify([]));
        try {
          const res = await fetch("/api/add-product", {
            method: "POST",
            body: fd,
          });
          const data = await res.json();
          if (data.success) {
            alert("Success!");
            location.reload();
          } else {
            alert("Failed!");
          }
        } catch (err) {
          alert("Server error!");
        } finally {
          btn.innerText = "Save Product to Inventory";
          btn.disabled = false;
        }
      }

      // REVIEWS MANAGEMENT FUNCTIONS
      async function loadAdminReviews() {
        try {
          const res = await fetch("/api/reviews");
          const reviews = await res.json();
          const list = document.getElementById("admin-reviews-list");
          if (!reviews.length) {
            list.innerHTML =
              "<p class='text-slate-400 text-sm'>No reviews yet.</p>";
            return;
          }
          list.innerHTML = reviews
            .map(
              (r) => `
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex flex-col gap-3">
              <div class="flex justify-between items-start">
                <div>
                  <p class="font-bold text-sm text-[#001F5B]">${r.userName}</p>
                  <p class="text-xs text-orange-400">${"⭐".repeat(r.rating)}</p>
                </div>
                <button onclick="deleteReview('${r._id}')" class="text-red-400 hover:text-red-600 transition">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              </div>
              <p class="text-sm text-slate-600 bg-white p-2 rounded-lg italic">"${r.comment}"</p>
              <div class="mt-2">
                <label class="text-[9px] font-bold text-slate-400 uppercase">Your Reply</label>
                <div class="flex gap-2 mt-1">
                  <input type="text" id="reply-${r._id}" value="${r.reply || ""}" placeholder="Thanks for shopping!..." class="flex-1 p-2 text-xs rounded-xl bg-white border">
                  <button onclick="sendReply('${r._id}')" class="bg-[#81a6c6] text-white px-4 py-2 rounded-xl text-[10px] font-bold uppercase">Update</button>
                </div>
              </div>
            </div>
          `,
            )
            .join("");
        } catch (e) {
          console.error("Review load error", e);
        }
      }

      async function sendReply(id) {
        const replyText = document.getElementById(`reply-${id}`).value;
        const res = await fetch("/api/reply-review", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            phone: currentUser.phone,
            reviewId: id,
            replyText,
          }),
        });
        if ((await res.json()).success) loadAdminReviews();
      }

      async function deleteReview(id) {
        if (!confirm("Delete this review forever?")) return;
        const res = await fetch("/api/delete-review", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: currentUser.phone, reviewId: id }),
        });
        if ((await res.json()).success) loadAdminReviews();
      }

      // PRODUCT FUNCTIONS
      async function updateVariantStockPrompt(prodId, index) {
        const add = prompt("Enter amount to ADD (e.g. 10 or -5):");
        if (add === null || isNaN(add)) return;
        const product = products.find((p) => p._id === prodId);
        const opts = [...product.options];
        opts[index].stock += Number(add);
        const fd = new FormData();
        fd.append("phone", currentUser.phone);
        fd.append("id", prodId);
        fd.append("options", JSON.stringify(opts));
        const res = await fetch("/api/update-product", {
          method: "POST",
          body: fd,
        });
        if ((await res.json()).success) loadAdmin();
      }

      async function addVariantPrompt(id) {
        const size = prompt("Size (e.g. 500ml):");
        if (!size) return;
        const price = prompt("Price (₹):");
        if (!price) return;
        const stock = prompt("Stock:");
        if (stock === null) return;
        const product = products.find((p) => p._id === id);
        const opts = [
          ...(product.options || []),
          { size, price: Number(price), stock: Number(stock) },
        ];
        const fd = new FormData();
        fd.append("phone", currentUser.phone);
        fd.append("id", id);
        fd.append("options", JSON.stringify(opts));
        const res = await fetch("/api/update-product", {
          method: "POST",
          body: fd,
        });
        if ((await res.json()).success) loadAdmin();
      }

      async function removeVariant(prodId, index) {
        if (!confirm("Remove variant?")) return;
        const product = products.find((p) => p._id === prodId);
        const opts = product.options.filter((_, i) => i !== index);
        const fd = new FormData();
        fd.append("phone", currentUser.phone);
        fd.append("id", prodId);
        fd.append("options", JSON.stringify(opts));
        const res = await fetch("/api/update-product", {
          method: "POST",
          body: fd,
        });
        if ((await res.json()).success) loadAdmin();
      }

      async function updateProduct(id, field, value) {
        const fd = new FormData();
        fd.append("phone", currentUser.phone);
        fd.append("id", id);
        fd.append(field, Number(value));
        const res = await fetch("/api/update-product", {
          method: "POST",
          body: fd,
        });
        if ((await res.json()).success) loadAdmin();
      }

      async function restockProduct(id, value) {
        const fd = new FormData();
        fd.append("phone", currentUser.phone);
        fd.append("id", id);
        fd.append("stockQuantity", Number(value));
        const res = await fetch("/api/update-product", {
          method: "POST",
          body: fd,
        });
        if ((await res.json()).success) loadAdmin();
      }

      async function updateProductImage(id, file) {
        if (!file) return;
        const fd = new FormData();
        fd.append("phone", currentUser.phone);
        fd.append("id", id);
        fd.append("productImage", file);
        try {
          const res = await fetch("/api/update-product", {
            method: "POST",
            body: fd,
          });
          if ((await res.json()).success) loadAdmin();
        } catch (e) {
          alert("Upload failed");
        }
      }

      async function deleteItem(id) {
        if (!confirm("Delete product permanently?")) return;
        await fetch("/api/delete-product", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: currentUser.phone, id }),
        });
        loadAdmin();
      }

      function logout() {
        localStorage.removeItem("kirana_user");
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
